services:
  db:
    image: postgres:alpine
    container_name: rgdev_flujo_efectivo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flujo_efectivo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./docker/backup_prod.sql:/docker-entrypoint-initdb.d/01_backup.sql:ro
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flujo_efectivo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rgdev_flujo_efectivo_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5174}:5173"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@db:5432/flujo_efectivo
      - AIVEN_PG_URL=postgres://postgres:postgres@db:5432/flujo_efectivo
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-70bc40a43d9a8bbd1272a8fa6374cb11}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-gospel}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-6320c418ecb25e4e096e42d407512d04}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-a191f3633778ae913bfc91a26164e636ecca0db85792316b46a9e87413418b9e}
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
